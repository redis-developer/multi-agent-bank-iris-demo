name: bank-iris-workshop

services:

  # The workbench shell (from redislabs-training/btc-rag-chatbot): one nginx
  # on port 80 that frames docs, VS Code, the app, terminals, and Redis
  # Insight as same-origin panels.
  workbench:
    image: nginx:alpine
    container_name: bank-workbench
    ports:
      - "80:80"
    volumes:
      - ./workbench:/usr/share/nginx/html:ro
      - ./workbench/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./workbench/proxy:/etc/nginx/proxy:ro
    depends_on:
      - docs
      - web
      - terminal
      - redisinsight

  # One-shot init: fixes vscode-data ownership and seeds user settings.json
  # so the welcome page / chat command center stay disabled on first launch.
  vscode-init:
    image: alpine:3.20
    container_name: bank-vscode-init
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - vscode-data:/home/coder/.local/share/code-server
      - ./code:/home/coder/code
      - ./docker/vscode/init.sh:/init.sh:ro
      - ./docker/vscode/settings.json:/seed/settings.json:ro
      - ./docker/vscode/extensions/workshop-open-file:/seed/extensions/workshop-open-file:ro
    restart: "no"

  vscode:
    image: codercom/code-server:latest
    container_name: bank-vscode
    depends_on:
      vscode-init:
        condition: service_completed_successfully
    environment:
      - VSCODE_RECONNECTION_GRACE_TIME=30000
    volumes:
      - ./code:/home/coder/code
      - ./.env:/home/coder/code/python/.env
      - vscode-data:/home/coder/.local/share/code-server
    command: >-
      --auth none
      --bind-addr 0.0.0.0:8080
      --disable-update-check
      --disable-workspace-trust
      --trusted-origins "*"
      /home/coder/code/python

  # The Terminal panel: ttyd + tmux with the repo mounted, so participants
  # can run ./solve, curl the api / memory server, and use redis-cli.
  terminal:
    build: ./docker/terminal
    container_name: bank-terminal
    restart: unless-stopped
    working_dir: /workshop
    volumes:
      - .:/workshop

  redis:
    image: redis:8.4
    container_name: bank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: bank-redisinsight
    ports:
      - "5540:5540"
    environment:
      - RI_PROXY_PATH=/redisinsight
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=Workshop Redis
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
    depends_on:
      redis:
        condition: service_healthy

  # Redis Agent Memory Server — the Agent Memory component of Redis Iris.
  # Owns working (session) memory and long-term memory, including automatic
  # fact extraction from conversations (Section 5).
  agent-memory:
    image: redislabs/agent-memory-server:latest
    container_name: bank-agent-memory
    ports:
      - "8088:8000"
    # The entrypoint sources non-empty values from .env at start, so a
    # plain `docker compose restart agent-memory agent-memory-worker`
    # applies .env changes — no recreation needed.
    entrypoint: ["/bin/sh", "/workshop-root/docker/agent-memory/entrypoint.sh"]
    command: ["agent-memory", "api", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./:/workshop-root:ro
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-unset}
      - LONG_TERM_MEMORY=true
      - DISABLE_AUTH=true
    depends_on:
      redis:
        condition: service_healthy

  # The memory server's background worker: runs the scheduled extraction
  # tasks that promote working-memory turns into long-term memories.
  # Without it, extraction is scheduled but never executes.
  agent-memory-worker:
    image: redislabs/agent-memory-server:latest
    container_name: bank-agent-memory-worker
    entrypoint: ["/bin/sh", "/workshop-root/docker/agent-memory/entrypoint.sh"]
    command: ["agent-memory", "task-worker"]
    volumes:
      - ./:/workshop-root:ro
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-unset}
      - LONG_TERM_MEMORY=true
      - DISABLE_AUTH=true
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: bank-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AGENT_MEMORY_URL=http://agent-memory:8000
      - DATA_DIR=/workshop/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - CTX_ADMIN_KEY=${CTX_ADMIN_KEY:-}
      - CTX_API_URL=${CTX_API_URL:-}
      - CTX_MCP_URL=${CTX_MCP_URL:-}
      - LANGCACHE_URL=${LANGCACHE_URL:-}
      - LANGCACHE_CACHE_ID=${LANGCACHE_CACHE_ID:-}
      - LANGCACHE_API_KEY=${LANGCACHE_API_KEY:-}
      - CACHE_SIMILARITY_THRESHOLD=${CACHE_SIMILARITY_THRESHOLD:-0.85}
      - DOTENV_PATH=/workshop-root/.env
    volumes:
      - ./code/python:/app
      - ./data:/workshop/data:ro
      - ./:/workshop-root:ro
    depends_on:
      redis:
        condition: service_healthy
      agent-memory:
        condition: service_started
    command: >
      uvicorn src.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src --reload-dir /workshop-root
      --reload-include ".env"

  web:
    image: nginx:alpine
    container_name: bank-web
    ports:
      - "3000:80"
    volumes:
      - ./code/web:/usr/share/nginx/html:ro
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  docs:
    image: nginx:alpine
    container_name: bank-docs
    ports:
      - "3001:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./docker/docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  vscode-data:
