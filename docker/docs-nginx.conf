# Docs server (Docsify). Overrides the stock nginx default.conf.
#
# The concept-lesson slide decks are fetched by reveal.js at a stable URL with
# no cache-buster, and stock nginx sends no Cache-Control header — so browsers
# apply heuristic freshness and serve stale decks after an edit. "no-cache"
# forces a revalidation on every load; unchanged files still return a fast 304,
# so authoring edits show up on a normal reload without a hard refresh.
#
# Do NOT add an `/index.html` SPA fallback here. Docsify is a hash-router (routes
# live in the URL fragment, never sent to the server), and with relativePath it
# probes for per-directory `_sidebar.md` files and relies on a 404 to fall back
# to the root sidebar. An `/index.html` fallback returns HTML-200 for those
# probes, so Docsify renders a broken sidebar (and an empty section dropdown).
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
