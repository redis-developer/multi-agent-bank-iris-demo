# Hide tmux completely - make it invisible
set -g status off

# Enable mouse support (scroll wheel, click, select)
set -g mouse on

# Copy out of the browser terminal: a mouse selection is pushed to the
# system clipboard via OSC 52 (ttyd/xterm.js passes it through), so
# select-with-mouse = copied. Shift+select for the browser's native
# selection as a fallback.
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Use largest client size (avoids dots when sizes differ)
set -g window-size largest
setw -g aggressive-resize on

