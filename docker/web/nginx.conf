server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolve the api container via Docker's DNS on every TTL expiry —
        # a static proxy_pass pins the IP from nginx startup and breaks
        # whenever the api container is recreated.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
