events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker embedded DNS — resolve upstreams at request time so a recreated
    # container (new IP) never leaves the workbench pointing at a stale one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # Workbench static files
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─────────────────────────────────────────────────────────────────
        # Proxy rules for embedded services
        # Each service is accessible via path instead of port, making all
        # iframes same-origin and avoiding X-Frame-Options issues.
        #
        # All proxy locations use the `set $...` + variable-in-proxy_pass
        # pattern so nginx resolves upstreams at request time. Prefix-
        # stripping routes use `rewrite ... break` because a variable
        # proxy_pass with a URI part replaces the whole request URI.
        # ─────────────────────────────────────────────────────────────────

        location /docs/ {
            set $docs_backend docs;
            rewrite ^/docs/(.*)$ /$1 break;
            proxy_pass http://$docs_backend:80;
            include /etc/nginx/proxy/proxy-params.conf;
        }

        location /vscode/ {
            set $vscode_backend vscode;
            rewrite ^/vscode/(.*)$ /$1 break;
            proxy_pass http://$vscode_backend:8080;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        # The WhatsApp-style chat UI (static nginx in the `web` container).
        # The UI uses relative asset paths, so the /app/ prefix is stripped.
        location /app/ {
            set $web_backend web;
            rewrite ^/app/(.*)$ /$1 break;
            proxy_pass http://$web_backend:80;
            include /etc/nginx/proxy/proxy-params.conf;
        }

        location = /terminal {
            return 301 /terminal/0/;
        }

        location /terminal/0/ {
            set $terminal_backend terminal;
            rewrite ^/terminal/0/(.*)$ /$1 break;
            proxy_pass http://$terminal_backend:7681;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /terminal/1/ {
            set $terminal_backend terminal;
            rewrite ^/terminal/1/(.*)$ /$1 break;
            proxy_pass http://$terminal_backend:7682;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /terminal/2/ {
            set $terminal_backend terminal;
            rewrite ^/terminal/2/(.*)$ /$1 break;
            proxy_pass http://$terminal_backend:7683;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /terminal/3/ {
            set $terminal_backend terminal;
            rewrite ^/terminal/3/(.*)$ /$1 break;
            proxy_pass http://$terminal_backend:7684;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /terminal/ {
            set $terminal_backend terminal;
            rewrite ^/terminal/(.*)$ /$1 break;
            proxy_pass http://$terminal_backend:7681;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        location /redisinsight/ {
            set $ri_backend redisinsight;
            proxy_pass http://$ri_backend:5540;
            include /etc/nginx/proxy/proxy-params.conf;
            include /etc/nginx/proxy/proxy-params-websocket.conf;
        }

        # Workshop bot API. The FastAPI routes live under /api/..., so the
        # prefix is preserved (no rewrite) — /api/chat proxies to /api/chat.
        location /api/ {
            set $api_backend api;
            proxy_pass http://$api_backend:8000;
            include /etc/nginx/proxy/proxy-params.conf;
            proxy_read_timeout 120s;
        }

        # Agent Memory Server (Section 5 inspects it with curl from the
        # Terminal panel; this route also lets the browser reach it).
        location /agent-memory/ {
            set $memory_backend agent-memory;
            rewrite ^/agent-memory/(.*)$ /$1 break;
            proxy_pass http://$memory_backend:8000;
            include /etc/nginx/proxy/proxy-params.conf;
            proxy_read_timeout 120s;
        }
    }
}
